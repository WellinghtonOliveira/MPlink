<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="stylesheet" href="./CSS/styles.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3Downloader</title>
</head>

<body>
    <div class="container page-wrapper">
        <nav>
            <div class="logo">MP3 <span>Downloader</span></div>
            <div class="nav-links">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Como usar</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </div>
        </nav>

        <main>
            <header>
                <h1>Converta vídeos em MP3</h1>
                <p>Cole o link do video abaixo e baixe o áudio em alta qualidade</p>

                <div class="cont-header">
                    <input id="input-link" type="text" placeholder="Cole o link aqui:">
                    <button id="button-convert">Converter</button>
                </div>
            </header>

            <div class="container-baixando">
                <h2 id="carregamento-baixando">Baixando</h2>
                <div class="div-baixando">
                    <ul id="lista-baixando">
                        <li id="log"> --- </li>
                    </ul>
                </div>
            </div>

            <div class="container-baixados">
                <h2>Baixados <span style="font-weight: bold; font-style: oblique;" id="quantia-baixados">0</span></h2>
                <div class="div-baixados">
                    <ul id="lista-baixados">
                        <li id="ex"> --- </li>
                    </ul>
                </div>
            </div>
        </main>

        <footer>
            <div>
                <h4>MP3 <span>Downloader</span></h4>
            </div>
        </footer>
    </div>
    <script src="./src/renderer.js"></script>
</body>
</html>
